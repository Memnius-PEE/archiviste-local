# Fiche d'identité du sujet, lue par le registre commun Memnius.
# Schéma : https://github.com/Memnius-PEE/registre/blob/v1/schema/memnius.schema.json
# Ne modifier que les valeurs ; les champs marqués (facultatif) peuvent être supprimés.
schema: memnius/1
id: SLUG-DU-SUJET              # identique au nom du dépôt GitHub, en minuscules-avec-tirets
titre: TITRE_DU_SUJET
resume: >-
  RÉSUMÉ_EN_UNE_À_TROIS_PHRASES
statut: actif                  # idee | actif | en-pause | termine | archive
nature: etude                  # etude | lecture | outil | donnees | projet
domaines: [DOMAINE]            # vocabulaire contrôlé : registre/vocabulaire.yaml
mots_cles: []                  # (facultatif) libres
langue: fr
mainteneurs:
  - github: IDENTIFIANT_GITHUB
    nom: PRÉNOM
contribution:
  ouverte: true                # accepte-t-on de nouveaux contributeurs ?
  niveau_entree: facile        # facile | moyen | expert
outils: []                     # (facultatif) ex. [python, jupyter, latex, zotero, obsidian]
agents:
  politique: relecture-humaine # libre | relecture-humaine | interdit
liens:                         # (facultatif)
  sujets: []                   # ex. [{id: autre-sujet, relation: prolonge}]
  externes: []                 # ex. [{titre: Article de référence, url: https://…}]
socle:                         # socle commun suivi (Memnius-PEE/regles, REGLES.md)
  version: v1
  niveau: socle                # socle | recommande (dépôt à agents, R1–R8) | renforce (options O1–O8)
  options: []                  # options adoptées, chacune par une entrée de decisions/, ex. [O6]
licence: CC-BY-4.0             # identifiant SPDX
visibilite: public             # public | prive (un dépôt privé n'a pas de garde A1 en offre gratuite)
archivage:                     # (facultatif) consignes pour l'archiviste
  politique: standard          # standard | prioritaire | exclure | local-seulement (traité seulement sur les machines des mainteneur·ices)
  exclure: []                  # motifs de chemins ignorés, ex. ["donnees/brut/**"]
cree_le: AAAA-MM-JJ
